name: pippal
description: "PipPal — a manual trading journal for forex, crypto and stock traders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/svg/

  # Inter 4.1 (SIL OFL, see assets/fonts/Inter-LICENSE.txt). Bundled so
  # tabular figures (tnum) are always available offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# App icon: logo 5a. Masters come from tool/generate_icon_masters.py;
# regenerate platform icons with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/android_foreground.png"
  adaptive_icon_monochrome: "assets/icon/android_monochrome.png"
  adaptive_icon_foreground_inset: 0 # master is already sized to the safe zone
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/ios_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/ios_tinted.png"
